<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Test Preview Image</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                max-width: 800px;
                margin: 50px auto;
                padding: 20px;
            }
            .preview-area {
                border: 2px dashed #ccc;
                padding: 20px;
                margin: 20px 0;
                text-align: center;
                min-height: 200px;
            }
            .preview-area img {
                max-width: 100%;
                height: auto;
            }
            input[type="file"] {
                margin: 10px 0;
            }
            .success {
                color: green;
                padding: 10px;
                background: #d4edda;
                border: 1px solid #c3e6cb;
                border-radius: 4px;
                margin: 10px 0;
            }
        </style>
    </head>
    <body>
        <h1>Test Preview Image Function</h1>

        <h2>Test 1: Featured Image</h2>
        <input
            type="file"
            id="featured_image"
            accept="image/*"
            onchange="previewFeaturedImage(this)"
        />
        <div class="preview-area" id="featured-preview-area">
            <p>Pilih gambar untuk preview</p>
        </div>

        <h2>Test 2: Multiple Images</h2>
        <input
            type="file"
            id="slide_images"
            multiple
            accept="image/*"
            onchange="previewSlideImages(this)"
        />
        <div class="preview-area" id="slide-preview-area">
            <p>Pilih beberapa gambar untuk preview</p>
        </div>

        <div id="messages"></div>

        <script>
            function showMessage(msg, type = "success") {
                const div = document.createElement("div");
                div.className = type;
                div.textContent = msg;
                document.getElementById("messages").appendChild(div);
                setTimeout(() => div.remove(), 3000);
            }

            function previewFeaturedImage(input) {
                console.log("previewFeaturedImage called", input.files);
                const previewArea = document.getElementById(
                    "featured-preview-area",
                );

                if (input.files && input.files[0]) {
                    const file = input.files[0];

                    // Validate
                    if (!file.type.match("image.*")) {
                        alert("File harus berupa gambar!");
                        return;
                    }

                    if (file.size > 5 * 1024 * 1024) {
                        alert("Ukuran file maksimal 5MB!");
                        return;
                    }

                    const reader = new FileReader();
                    reader.onload = function (e) {
                        previewArea.innerHTML =
                            '<img src="' + e.target.result + '" alt="Preview">';
                        showMessage("Preview berhasil dimuat!");
                    };
                    reader.onerror = function () {
                        alert("Gagal membaca file!");
                    };
                    reader.readAsDataURL(file);
                }
            }

            function previewSlideImages(input) {
                console.log("previewSlideImages called", input.files);
                const previewArea =
                    document.getElementById("slide-preview-area");

                if (input.files && input.files.length > 0) {
                    const fileCount = input.files.length;

                    if (fileCount > 7) {
                        alert("Maksimal 7 gambar!");
                        return;
                    }

                    previewArea.innerHTML = "";
                    let loaded = 0;

                    for (let i = 0; i < fileCount; i++) {
                        const file = input.files[i];

                        if (!file.type.match("image.*")) continue;
                        if (file.size > 5 * 1024 * 1024) continue;

                        const reader = new FileReader();
                        reader.onload = function (e) {
                            const img = document.createElement("img");
                            img.src = e.target.result;
                            img.style.width = "150px";
                            img.style.margin = "5px";
                            previewArea.appendChild(img);

                            loaded++;
                            if (loaded === fileCount) {
                                showMessage(
                                    fileCount + " gambar berhasil dimuat!",
                                );
                            }
                        };
                        reader.readAsDataURL(file);
                    }
                }
            }
        </script>
    </body>
</html>
